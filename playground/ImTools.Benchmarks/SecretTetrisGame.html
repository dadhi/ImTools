<html>
<style>
    #Field {
        position: absolute;
        margin-left: 140px;
        width: 200px;
        height: 300px;
        background: rgb(0%, 55%, 75%);
        border: ridge 5px;
    }

    #Cell {
        width: 19px;
        height: 20px;
        background: blue;
        border: ridge 1pt;
        visibility: hidden;
    }

    #BigCell {
        width: 23px;
        height: 23px;
        background: blue;
        border: outset 2pt;
        visibility: hidden;
    }

    #Score {
        position: absolute;
        margin-left: 350px;
        width: 120px;
        height: 25px;
        text-align: center;
        background: rgb(70%, 70%, 70%);
        border: ridge;
        font: verdana 120%;
        color: blue;
    }

    #Next {
        position: absolute;
        margin-left: 360px;
        margin-top: 20px;
        width: 100px;
        height: 100px;
        background: rgb(70%, 70%, 70%);
        border: ridge rgb(80%, 80%, 80%);
    }

    #Controls {
        position: absolute;
        background: rgb(70%, 70%, 70%);
        border: ridge;
    }
</style>

<head>

    <title> Tetris </title>

    <script language="JavaScript">
        var fieldHeight = 15
        var fieldWidth = 10
        var figureSize = 4
        var figuresNumber = 7
        var bonus = 100
        var moreBonus = 200
        var changeBonusSpeed = 2000
        var changeGameSpeed = 50     //               
        var startGameSpeed = 500   //               
        var gameSpeed = startGameSpeed
        var gameTimer

        var gameField
        var field = new Array()
        for (i = 0; i < fieldHeight; i++)
            field[i] = new Array(fieldWidth)

        //          
        var figure10 = new Array()
        var figure11 = new Array()

        //                              
        var figure20 = new Array()
        var figure21 = new Array()

        //                               
        var figure30 = new Array()
        var figure31 = new Array()

        //                           
        var figure40 = new Array()
        var figure41 = new Array()
        var figure42 = new Array()
        var figure43 = new Array()

        //                            
        var figure50 = new Array()
        var figure51 = new Array()
        var figure52 = new Array()
        var figure53 = new Array()


        //         
        var figure60 = new Array()
        var figure61 = new Array()
        var figure62 = new Array()
        var figure63 = new Array()

        //     
        var figure70 = new Array()

        var x = 3
        var y = 0
        var score = 0
        var isStart = 1
        var gameStop = 1
        var gamePause = 0
        var chosenFigure = 0
        var location = 0
        var nextChosenFigure = 0
        var fallFig

        for (i = 0; i < figureSize; i++) {
            figure10[i] = new Array(figureSize)
            figure11[i] = new Array(figureSize)
            figure20[i] = new Array(figureSize)
            figure21[i] = new Array(figureSize)
            figure30[i] = new Array(figureSize)
            figure31[i] = new Array(figureSize)
            figure40[i] = new Array(figureSize)
            figure41[i] = new Array(figureSize)
            figure42[i] = new Array(figureSize)
            figure43[i] = new Array(figureSize)
            figure50[i] = new Array(figureSize)
            figure51[i] = new Array(figureSize)
            figure52[i] = new Array(figureSize)
            figure53[i] = new Array(figureSize)
            figure60[i] = new Array(figureSize)
            figure61[i] = new Array(figureSize)
            figure62[i] = new Array(figureSize)
            figure63[i] = new Array(figureSize)
            figure70[i] = new Array(figureSize)

            for (j = 0; j < figureSize; j++) {
                figure10[i][j] = 0
                figure11[i][j] = 0
                figure20[i][j] = 0
                figure21[i][j] = 0
                figure30[i][j] = 0
                figure31[i][j] = 0
                figure40[i][j] = 0
                figure41[i][j] = 0
                figure42[i][j] = 0
                figure43[i][j] = 0
                figure50[i][j] = 0
                figure51[i][j] = 0
                figure52[i][j] = 0
                figure53[i][j] = 0
                figure60[i][j] = 0
                figure61[i][j] = 0
                figure62[i][j] = 0
                figure63[i][j] = 0
                figure70[i][j] = 0
            }
        }
        //          
        figure10[0][1] = 1; figure10[1][1] = 1; figure10[2][1] = 1; figure10[3][1] = 1;
        figure11[1][0] = 1; figure11[1][1] = 1; figure11[1][2] = 1; figure11[1][3] = 1;

        //                              
        figure20[0][2] = 1; figure20[1][1] = 1; figure20[1][2] = 1; figure20[2][1] = 1;
        figure21[0][0] = 1; figure21[0][1] = 1; figure21[1][1] = 1; figure21[1][2] = 1;

        //                               
        figure30[0][1] = 1; figure30[1][1] = 1; figure30[1][2] = 1; figure30[2][2] = 1;
        figure31[0][1] = 1; figure31[0][2] = 1; figure31[1][0] = 1; figure31[1][1] = 1;

        //                           
        figure40[0][1] = 1; figure40[1][1] = 1; figure40[2][0] = 1; figure40[2][1] = 1;
        figure41[0][0] = 1; figure41[1][0] = 1; figure41[1][1] = 1; figure41[1][2] = 1;
        figure42[0][1] = 1; figure42[0][2] = 1; figure42[1][1] = 1; figure42[2][1] = 1;
        figure43[1][0] = 1; figure43[1][1] = 1; figure43[1][2] = 1; figure43[2][2] = 1;

        //                            
        figure50[0][1] = 1; figure50[1][1] = 1; figure50[2][1] = 1; figure50[2][2] = 1;
        figure51[1][0] = 1; figure51[1][1] = 1; figure51[1][2] = 1; figure51[2][0] = 1;
        figure52[0][0] = 1; figure52[0][1] = 1; figure52[1][1] = 1; figure52[2][1] = 1;
        figure53[0][2] = 1; figure53[1][0] = 1; figure53[1][1] = 1; figure53[1][2] = 1;

        //         
        figure60[0][1] = 1; figure60[1][0] = 1; figure60[1][1] = 1; figure60[1][2] = 1;
        figure61[0][1] = 1; figure61[1][1] = 1; figure61[1][2] = 1; figure61[2][1] = 1;
        figure62[1][0] = 1; figure62[1][1] = 1; figure62[1][2] = 1; figure62[2][1] = 1;
        figure63[0][1] = 1; figure63[1][0] = 1; figure63[1][1] = 1; figure63[2][1] = 1;

        //     
        figure70[0][1] = 1; figure70[0][2] = 1; figure70[1][1] = 1; figure70[1][2] = 1;


        //------------------------------------------------------------------------------------------
        function drawFig() {
            for (i = 0; i < figureSize; i++)
                for (j = 0; j < figureSize; j++)
                    if (fallFig[i][j]) {
                        gameField[((y + i) * fieldWidth) + (x + j)].style.visibility = "visible"
                        field[y + i][x + j] = 1
                    }
        }


        //------------------------------------------------------------------------------------------  
        function drawLastFigure() {
            var index = 0
            var k = 0
            var shift = 0
            for (j = 0; j < figureSize - 1; j++) {
                for (i = figureSize - 1; i >= 0; i--)
                    if (fallFig[i][j]) {
                        index = i
                        break
                    }
                while (index && field[y + (index--)][x + j])
                    ++k
                shift = Math.max(shift, k)
                index = k = 0
            }
            y = -shift
            for (i = figureSize - 1; i >= (-y); i--)
                for (j = 0; j < figureSize - 1; j++)
                    if (fallFig[i][j]) {
                        gameField[((y + i) * fieldWidth) + (x + j)].style.visibility = "visible"
                        field[y + i][x + j] = 1
                    }
        }


        //------------------------------------------------------------------------------------------
        function eraseFig() {
            for (i = 0; i < figureSize; i++)
                for (j = 0; j < figureSize; j++)
                    if (fallFig[i][j]) {
                        gameField[((y + i) * fieldWidth) + (x + j)].style.visibility = "hidden"
                        field[y + i][x + j] = 0
                    }
        }

        //------------------------------------------------------------------------------------------
        function getClearLines() {
            clearLines = new Array()
            k = 0
            for (i = fieldHeight - 1; i >= 0; i--) {
                for (j = 0; j < fieldWidth; j++)
                    if (!field[i][j])
                        break
                if (j == fieldWidth)
                    clearLines[k++] = i
            }
            return clearLines
        }


        //------------------------------------------------------------------------------------------
        function computeScore(linesNumber) {
            score += bonus + (linesNumber - 1) * moreBonus
            speed = startGameSpeed -
                changeGameSpeed * Math.floor(score / changeBonusSpeed)
            if (speed > 0)
                gameSpeed = speed
            document.all.Score.innerHTML = score
        }


        //------------------------------------------------------------------------------------------
        function checkFillLines() {
            clearLines = getClearLines()
            if (clearLines.length) {
                computeScore(clearLines.length)
                for (i = 0; i < clearLines.length; i++) {
                    index = clearLines[i] + i
                    for (j = index - 1; j >= -1; j--)
                        for (k = 0; k < fieldWidth; k++)
                            field[j + 1][k] = (j < 0) ? 0 : field[j][k]
                }
                for (i = 0; i < fieldHeight; i++)
                    for (j = 0; j < fieldWidth; j++)
                        gameField[i * fieldWidth + j].style.visibility = (field[i][j]) ? "visible" : "hidden"
            }
        }


        //------------------------------------------------------------------------------------------   
        function selectRandomFigure() {
            p = 1 / figuresNumber
            a = Math.random()
            for (s = 0, i = 0; i < figuresNumber; i++)
                if (s <= a && a < (s += p))
                    return (i + 1)
        }


        //------------------------------------------------------------------------------------------
        function showNextFigure() {
            eval("figure = figure" + nextChosenFigure + "0")
            for (i = 0; i < figureSize; i++)
                for (j = 0; j < figureSize; j++)
                    document.all.BigCell[i * figureSize + j].style.visibility = (figure[i][j]) ? "visible" : "hidden"
        }


        //------------------------------------------------------------------------------------------
        function chooseFigure() {
            if (!nextChosenFigure)
                nextChosenFigure = selectRandomFigure()
            choice = nextChosenFigure
            nextChosenFigure = selectRandomFigure()
            return choice
        }


        //------------------------------------------------------------------------------------------
        function start() {
            checkFillLines()
            chosenFigure = chooseFigure()
            location = 0
            eval("fallFig = figure" + chosenFigure + location)

            if (!canFall()) {
                drawLastFigure()
                alert("You loose !!!")
                gameStop = 1
            }
            else {
                drawFig()
                showNextFigure()
            }
        }


        //------------------------------------------------------------------------------------------  
        function canFall() {
            for (j = 0; j < figureSize; j++)
                for (i = figureSize - 1; i >= 0; i--)
                    if (fallFig[i][j])
                        if (y + i + 2 > fieldHeight)
                            return 0
                        else
                            if (!field[y + i + 1][x + j])
                                break
                            else
                                return 0
            return 1
        }


        //------------------------------------------------------------------------------------------  
        function canLeft() {
            for (i = 0; i < figureSize; i++)
                for (j = 0; j < figureSize; j++)
                    if (fallFig[i][j])
                        if (x + j - 1 < 0)
                            return 0
                        else
                            if (!field[y + i][x + j - 1])
                                break
                            else
                                return 0
            return 1
        }


        //------------------------------------------------------------------------------------------  
        function canRight() {
            for (i = 0; i < figureSize; i++)
                for (j = figureSize - 1; j >= 0; j--)
                    if (fallFig[i][j])
                        if (x + j + 2 > fieldWidth)
                            return 0
                        else
                            if (!field[y + i][x + j + 1])
                                break
                            else
                                return 0
            return 1
        }


        //------------------------------------------------------------------------------------------  
        function canRotate(newFallFig) {
            for (i = 0; i < figureSize; i++)
                for (j = 0; j < figureSize; j++)
                    if (newFallFig[i][j] && ((field[y + i][x + j] && !fallFig[i][j]) || (y + i + 1 > fieldHeight || x + j < 0 || x + j + 1 > fieldWidth)))
                        return 0
            return 1
        }


        //------------------------------------------------------------------------------------------  
        function shift() {
            if (canFall()) {
                eraseFig()
                ++y
                drawFig()
            }
            else {
                isStart = 1
                x = 3
                y = 0
            }
        }

        //------------------------------------------------------------------------------------------
        function rotate() {
            if (!isStart) {
                if (0 < chosenFigure && chosenFigure < 4)
                    newLocation = (location == 1) ? 0 : 1
                else if (chosenFigure < 7)
                    newLocation = (location == 3) ? 0 : (location + 1)
                else
                    newLocation = 0
                eval("newFallFig = figure" + chosenFigure + newLocation)

                if (canRotate(newFallFig)) {
                    eraseFig()
                    location = newLocation
                    fallFig = newFallFig
                    drawFig()
                }
            }
        }


        //------------------------------------------------------------------------------------------
        function left() {
            if (!isStart && canLeft()) {
                eraseFig()
                --x
                drawFig()
            }
        }


        //------------------------------------------------------------------------------------------
        function right() {
            if (!isStart && canRight()) {
                eraseFig()
                ++x
                drawFig()
            }
        }


        //------------------------------------------------------------------------------------------
        function down() {
            while (!isStart)
                shift()
        }


        //------------------------------------------------------------------------------------------
        function pause() {
            gamePause = gamePause ? 0 : 1
            if (!gamePause)
                run()
        }


        //------------------------------------------------------------------------------------------
        function run() {
            if (gamePause || gameStop)
                return

            if (isStart) {
                isStart = 0
                start()
            }
            else
                shift()

            gameTimer = setTimeout("run()", gameSpeed)
        }


        //------------------------------------------------------------------------------------------
        function init() {
            gameField = document.all.Cell
            for (i = 0; i < fieldHeight; i++)
                for (j = 0; j < fieldWidth; j++) {
                    gameField[i * fieldWidth + j].style.visibility = "hidden"
                    field[i][j] = 0
                }
            document.all.Score.innerHTML = 0
            isStart = 1
            chosenFigure = 1
            nextChosenFigure = 0
            location = 0
            gameSpeed = startGameSpeed
            score = 0
            x = 3
            y = 0
        }


        //------------------------------------------------------------------------------------------
        function runGame() {
            if (gameStop) {
                gameStop = 0
                init()
                run()
            }
        }  
    </script>

</head>

<body>

    <span id=Controls>
        <table border=1>
            <tr>
                <td align=center>
                    <input type='button' accesskey='r' value='Run it' onClick='runGame()'>
                </td>
                <td align=center><strong>(Alt+r)</strong></td>
            </tr>
            <tr>
                <td align=center>
                    <input type='button' accesskey='p' value='Pause' onClick="pause()">
                </td>
                <td align=center><strong>(Alt+p)</strong></td>
            </tr>
            <tr>
                <td align=center>
                    <input type='button' accesskey='w' value='Rotate' onClick="rotate()">
                </td>
                <td align=center><strong>(Alt+w)</strong></td>
            </tr>
            <tr>
                <td align=center>
                    <input type='button' accesskey='q' value='Left' onClick="left()">
                </td>
                <td align=center><strong>(Alt+q)</strong></td>
            </tr>
            <tr>
                <td align=center>
                    <input type='button' accesskey='e' value='Right' onClick="right()">
                </td>
                <td align=center><strong>(Alt+e)</strong></td>
            </tr>
            <tr>
                <td align=center>
                    <input type='button' accesskey='s' value='Down' onClick="down()">
                </td>
                <td align=center><strong>(Alt+s)</strong></td>
            </tr>
        </table>
    </span>

    <script language="JavaScript">
        document.write("<span id=Field>")
        for (i = 0; i < 150; i++)
            document.write("<span id=Cell></span>")
        document.write("</span>")

        s = "<span id=Score></span>"
        document.write(s + "<br>")

        s = "<span id=Next>"
        for (i = 0; i < 16; i++)
            s += "<span id=BigCell></span>"
        s += "</span>"
        document.write(s + "<br>")
        //document.all.Score.innerHTML = 0
    </script>
</body>

</html>
